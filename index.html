<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Book Library</h1><p>Find your next favorite book.</p></header>
  <main>
    <h2>Search books</h2>
    <form id="searchForm"><input id="searchInput" type="text" placeholder="Enter a book title or author"><button type="submit">Search</button></form>
    <button id="allButton" type="button">All books</button>
    <button id="favoritesButton" type="button">My favorites</button>
    <p id="message">Search for a book to get started.</p>
    <section id="bookList"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
